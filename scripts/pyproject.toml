[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrdocs-spark-engine"
version = "0.5.0"
description = "Deterministic multipass OCR and banking extraction worker"
readme = "README.md"
requires-python = ">=3.10, <3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "opencv-python-headless==4.10.0.84",
    "Pillow==10.4.0",
    "pypdfium2==4.30.0",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "duckdb==1.1.1",
    # torch intentionally not pinned here either -- see requirements.txt comment.
    "pytesseract==0.3.13",
    "spacy==3.7.5",
    "easyocr==1.7.2",
    "python-docx==1.1.2",
    "striprtf==0.0.26",
    "requests==2.32.3",
]

[project.optional-dependencies]
screened = [
    "paddleocr==2.8.1",
    "paddlepaddle==2.6.2",
    "surya-ocr==0.4.14",
]

[tool.setuptools]
py-modules = ["ocr_spark_engine"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
