[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrdocs-spark-engine"
version = "0.5.0"
description = "Deterministic multipass OCR and banking extraction worker"
readme = "README.md"
requires-python = ">=3.10, <3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "opencv-python-headless==4.10.0.84",
    "Pillow==10.4.0",
    "pypdfium2==4.30.0",
    "numpy==2.1.1",
    "pandas==2.2.3",
    "duckdb==1.1.1",
    "torch==2.4.1",
    "pytesseract==0.3.13",
    "spacy==3.7.5",
    "easyocr==1.7.2",
    "gdown==5.2.0",
]

[project.optional-dependencies]
screened = [
    "PyMuPDF==1.24.10",
    "paddleocr==2.8.1",
    "surya-ocr==0.4.14",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
