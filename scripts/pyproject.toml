[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrdocs-spark-engine"
version = "0.5.0"
description = "Deterministic multipass OCR and banking extraction worker"
readme = "README.md"
requires-python = ">=3.10, <3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "opencv-python-headless==5.0.0.93",
    "Pillow==12.3.0",
    "pypdfium2==5.13.0",
    "numpy==2.5.2",
    "pandas==3.0.6",
    "duckdb==1.5.5",
    # torch intentionally not pinned here either -- see requirements.txt comment.
    "pytesseract==0.3.13",
    "python-docx==1.2.0",
    "striprtf==0.0.33",
    "transformers==4.57.6",
    "tokenizers==0.22.2",
    "safetensors==0.8.0",
    "huggingface_hub==0.36.2",
    "accelerate==1.15.0",
    "sentencepiece==0.2.2",
    "protobuf==7.36.2",
    "requests==2.34.2",
]

[project.optional-dependencies]
screened = [
    "surya-ocr==0.4.14",
]

[tool.setuptools]
py-modules = ["ocr_spark_engine", "ocr_hybrid"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
